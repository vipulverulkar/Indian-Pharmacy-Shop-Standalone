name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

jobs:
  docker:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
      - name: Set image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  windows:
    name: Build Windows EXE
    runs-on: windows-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pyinstaller
      - name: Build EXE
        run: pyinstaller --noconfirm --clean pharmacy.spec
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist/IndianPharmacyShop.exe -DestinationPath IndianPharmacyShop-windows.zip
      - name: Build summary
        shell: pwsh
        run: |
          $size = (Get-Item IndianPharmacyShop-windows.zip).Length
          $sizeMB = [math]::Round($size / 1MB, 2)
          "### Windows EXE" >> $env:GITHUB_STEP_SUMMARY
          "| Property | Value |" >> $env:GITHUB_STEP_SUMMARY
          "|----------|-------|" >> $env:GITHUB_STEP_SUMMARY
          "| File | IndianPharmacyShop-windows.zip |" >> $env:GITHUB_STEP_SUMMARY
          "| Size | $sizeMB MB |" >> $env:GITHUB_STEP_SUMMARY
          "| Executable | IndianPharmacyShop.exe |" >> $env:GITHUB_STEP_SUMMARY
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: IndianPharmacyShop-windows.zip
          retention-days: 30

  linux:
    name: Build Linux EXE
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pyinstaller
      - name: Build EXE
        run: pyinstaller --noconfirm --clean pharmacy.spec
      - name: Package
        run: zip -r IndianPharmacyShop-linux.zip dist/IndianPharmacyShop
      - name: Build summary
        run: |
          size=$(stat -c%s IndianPharmacyShop-linux.zip)
          sizeMB=$(awk "BEGIN {printf \"%.2f\", $size/1024/1024}")
          echo "### Linux EXE" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| File | IndianPharmacyShop-linux.zip |" >> $GITHUB_STEP_SUMMARY
          echo "| Size | $sizeMB MB |" >> $GITHUB_STEP_SUMMARY
          echo "| Executable | IndianPharmacyShop |" >> $GITHUB_STEP_SUMMARY
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-exe
          path: IndianPharmacyShop-linux.zip
          retention-days: 30

  release:
    name: Create GitHub Release
    if: (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') && startsWith(github.ref, 'refs/tags/v')
    needs: [docker, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend bundle
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Package frontend
        run: |
          cd frontend/dist
          zip -r ../../pharmacy-frontend-${{ github.ref_name }}.zip .
      - name: Download Windows EXE
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: .
      - name: Download Linux EXE
        uses: actions/download-artifact@v4
        with:
          name: linux-exe
          path: .
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            pharmacy-frontend-${{ github.ref_name }}.zip
            IndianPharmacyShop-windows.zip
            IndianPharmacyShop-linux.zip