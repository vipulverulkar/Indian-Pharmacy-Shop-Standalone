name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: exe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pyinstaller

      - name: Build executable
        run: pyinstaller --noconfirm --clean pharmacy.spec

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist/IndianPharmacyShop.exe -DestinationPath IndianPharmacyShop-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: IndianPharmacyShop-windows
          path: IndianPharmacyShop-windows.zip
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: IndianPharmacyShop-windows.zip
